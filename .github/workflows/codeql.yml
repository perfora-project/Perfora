name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 05:17 UTC — off the hour, so it does not queue behind everyone.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze python
    # Code scanning on a private repository requires GitHub Advanced Security.
    # Without it the API rejects the upload, so the job would fail on every
    # push for a reason unrelated to the code. It starts working by itself the
    # moment the repository becomes public (or GHAS is enabled).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
