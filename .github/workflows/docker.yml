name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "perfora/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "perfora/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/perfora

jobs:
  build:
    name: build (and push on main/tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build only — never push an image from untrusted code.
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must decode the bundled sample before it is published.
      - name: smoke-test the image
        run: |
          mkdir -p /tmp/data
          docker run --rm -v /tmp/data:/data ${{ env.IMAGE }}:ci \
            perfora sample /data/roll
          docker run --rm -v /tmp/data:/data ${{ env.IMAGE }}:ci \
            perfora -i /data/roll/sample_roll.png \
                    -o /data/roll/out.perfora.json --dpi 300 -v
          test -s /tmp/data/roll/out.perfora.json
          docker run --rm ${{ env.IMAGE }}:ci perfora formats
          docker run --rm ${{ env.IMAGE }}:ci perfora-notebook --help

      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
